services:
  geoai:
    image: geoai
    build:
      context: "./cli/internal/adapter/client/imagebuilder/docker/geoai"
    ports:
      - "8888:8888"
    environment:
      SEDONA_SOURCE_BUCKET: ${SEDONA_SOURCE_BUCKET}
    profiles:
      - "chapter-7-5"
    volumes:
      - ./book/chapter7/RasterSegmentation.ipynb:/home/ubuntu/sedona-ai/chapter7/RasterSegmentation.ipynb
  ors:
    image: ors
    ports:
      - "8085:8082"
    environment:
      REBUILD_GRAPHS: True
      ors.engine.source_file: /home/ors/files/ile-de-france-latest.osm.pbf
    build:
      context: "./cli/internal/adapter/client/imagebuilder/docker/ors"
    profiles:
      - "chapter-7-6"
    volumes:
      - ./book/chapter7/ors/graphs:/home/ors/graphs
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8082/ors/v2/health || exit 1" ]
      start_period: 1m
      interval: 10s
      timeout: 2s
      retries: 3
  sedona:
    image: sedona
    build:
      context: "./cli/internal/adapter/client/imagebuilder/docker/sedona"
    ports:
      - "4040:4040"
      - "7077:7077"
      - "8081:8080"
      - "8888:8888"
    environment:
      SEDONA_SOURCE_BUCKET: ${SEDONA_SOURCE_BUCKET}
      AWS_REGION: ${AWS_REGION}
    profiles:
      - "chapter-3-1"
      - "chapter-3-2"
      - "chapter-3-3"
      - "chapter-3-4"
      - "chapter-4-1"
      - "chapter-4-2"
      - "chapter-4-3"
      - "chapter-4-4"
      - "chapter-5-1"
      - "chapter-5-2"
      - "chapter-5-3"
      - "chapter-5-4"
      - "chapter-5-5"
      - "chapter-5-6"
      - "chapter-6-5"
      - "chapter-6-1"
      - "chapter-6-2"
      - "chapter-6-4"
      - "chapter-7-1"
      - "chapter-7-2"
      - "chapter-7-3"
      - "chapter-7-4"
      - "chapter-7-6"
      - "chapter-7-7"
      - "chapter-8-4"
      - "chapter-10-1"
      - "chapter-10-2"
      - "chapter-10-3"
      - "chapter-11-2"
    volumes:
      # chapter 3
      - ./book/chapter3/LoadingVectorDataFormats.ipynb:/opt/workspace/chapter3/LoadingVectorDataFormats.ipynb
      - ./book/chapter3/popular_routes_config.json:/opt/workspace/chapter3/popular_routes_config.json
      - ./book/chapter3/populardropoff_config.json:/opt/workspace/chapter3/populardropoff_config.json
      - ./book/chapter3/analysis_area.json:/opt/workspace/chapter3/analysis_area.json
      - ./book/chapter3/LoadingRasterData.ipynb:/opt/workspace/chapter3/LoadingRasterData.ipynb
      - ./book/chapter3/ReadingFromPostgreSQL.ipynb:/opt/workspace/chapter3/ReadingFromPostgreSQL.ipynb
      - ./book/chapter3/NewYorkTaxiAnalysis.ipynb:/opt/workspace/chapter3/NewYorkTaxiAnalysis.ipynb
      # chapter 4
      - ./book/chapter4/SpatialQueries.ipynb:/opt/workspace/chapter4/SpatialQueries.ipynb
      - ./book/chapter4/RealEstateAnalysis.ipynb:/opt/workspace/chapter4/RealEstateAnalysis.ipynb
      - ./book/chapter4/SpatialRelationships.ipynb:/opt/workspace/chapter4/SpatialRelationships.ipynb
      - ./book/chapter4/SpatialSQLAndVectorManipulation.ipynb:/opt/workspace/chapter4/SpatialSQLAndVectorManipulation.ipynb
      # chapter 5
      - ./book/chapter5/MapAlgebra.ipynb:/opt/workspace/chapter5/MapAlgebra.ipynb
      - ./book/chapter5/Raster SQL and Raster Data Manipulation.ipynb:/opt/workspace/chapter5/Raster SQL and Raster Data Manipulation.ipynb
      - ./book/chapter5/RasterJoin.ipynb:/opt/workspace/chapter5/RasterJoin.ipynb
      - ./book/chapter5/RasterModel.ipynb:/opt/workspace/chapter5/RasterModel.ipynb
      - ./book/chapter5/Use Case Insurance Risk Modeling.ipynb:/opt/workspace/chapter5/Use Case Insurance Risk Modeling.ipynb
      - ./book/chapter5/Zonal Statistics.ipynb:/opt/workspace/chapter5/Zonal Statistics.ipynb
      - ./book/chapter5/zone_stats_config.json:/opt/workspace/chapter5/zone_stats_config.json
      - ./book/chapter5/images/:/opt/workspace/chapter5/images/
      # chapter 6
      - ./book/chapter6/VectorGeospatialVisualization.ipynb:/opt/workspace/chapter6/VectorGeospatialVisualization.ipynb
      - ./book/chapter6/kepler_map_config.json:/opt/workspace/chapter6/kepler_map_config.json
      - ./book/chapter6/ManipulatingGeospatialVectorData.ipynb:/opt/workspace/chapter6/ManipulatingGeospatialVectorData.ipynb
      - ./book/chapter6/RasterDataTools.ipynb:/opt/workspace/chapter6/RasterDataTools.ipynb
      - ./book/chapter6/ID73_S20_W70_RP10_depth.tif:/opt/workspace/chapter6/ID73_S20_W70_RP10_depth.tif
      - ./book/chapter6/DBTTransformations.ipynb:/opt/workspace/chapter6/DBTTransformations.ipynb
      # chapter 7
      - ./book/chapter7/ClusteringWithApacheSedona.ipynb:/opt/workspace/chapter7/ClusteringWithApacheSedona.ipynb
      - ./book/chapter7/OutlierDetection.ipynb:/opt/workspace/chapter7/OutlierDetection.ipynb
      - ./book/chapter7/HotSpotAnalysis.ipynb:/opt/workspace/chapter7/HotSpotAnalysis.ipynb
      - ./book/chapter7/AutoCorrelation.ipynb:/opt/workspace/chapter7/AutoCorrelation.ipynb
      - ./book/chapter7/AccidentAnalysis.ipynb:/opt/workspace/chapter7/AccidentAnalysis.ipynb
      - ./book/chapter7/GeospatialDateLakehouse.ipynb:/opt/workspace/chapter8/GeospatialDateLakehouse.ipynb
      - ./book/chapter7/MLLib.ipynb:/opt/workspace/chapter7/MLLib.ipynb
      - ./book/chapter7/hotspot_viz_black.json:/opt/workspace/chapter7/hotspot_viz_black.json
      - ./book/chapter7/hotspot_viz_color.json:/opt/workspace/chapter7/hotspot_viz_color.json
      - ./book/chapter7/kmeans_viz_config.json:/opt/workspace/chapter7/kmeans_viz_config.json
      - ./book/chapter7/slope.py:/opt/workspace/chapter7/slope.py
      # chapter 10
      - ./book/chapter10/OptimizingApacheSedonaProgram.ipynb:/opt/workspace/chapter10/OptimizingApacheSedonaProgram.ipynb
      - ./book/chapter10/OptimizingSpatialJoin.ipynb:/opt/workspace/chapter10/OptimizingSpatialJoin.ipynb
      - ./book/chapter10/SpatialPartitioning.ipynb:/opt/workspace/chapter10/SpatialPartitioning.ipynb
      # extras
      - ./book/chapter11/SedonaDBExamples.ipynb:/opt/workspace/chapter11/SedonaDBExamples.ipynb
      # source data
      - ./book/source_data/density_points:/opt/workspace/chapter7/source_data/density_points
      - ./book/source_data/hot_spot:/opt/workspace/chapter7/source_data/hot_spot
  prefect:
    image: prefect
    build:
      context: "./cli/internal/adapter/client/imagebuilder/docker/prefect"
    container_name: prefect
    profiles:
      - "chapter-6"
    ports:
      - "4200:4200"
    command: ["./entrypoint.sh"]
    volumes:
      - ./cli/internal/adapter/client/imagebuilder/docker/prefect/:/opt/prefect
  airflow:
    image: airflow
    build:
      context: "./cli/internal/adapter/client/imagebuilder/docker/airflow"
    container_name: airflow
    environment:
      SEDONA_SOURCE_BUCKET: ${SEDONA_SOURCE_BUCKET}
    profiles:
      - "chapter-6-3"
      - "chapter-8-4"
    ports:
      - "8080:8080"
    volumes:
      - ./book/chapter6/dags/:/opt/airflow/dags/chapter6
      - ./book/chapter8/dags/:/opt/airflow/dags/chapter8
    restart: on-failure
  minio:
    image: minio
    build:
      context: "./cli/internal/adapter/client/imagebuilder/docker/minio"
    environment:
      MINIO_ROOT_USER: sedona
      MINIO_ROOT_PASSWORD: sedona_password
    container_name: minio
    profiles:
      - "chapter-3-3"
      - "chapter-6-3"
      - "chapter-8-4"
      - "chapter-10-1"
      - "chapter-10-2"
      - "chapter-10-3"
      - "chapter-10-4"
      - "chapter-11-1"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./book/source_data/transportation:/app/sources/transportation
      - ./data:/app/sources/source_data
    restart: on-failure
  thriftserver:
    image: thriftserver
    build:
      context: "./cli/internal/adapter/client/imagebuilder/docker/thriftserver"
    container_name: thriftserver
    profiles:
      - "chapter-6-4"
    ports:
      - "4040:4040"
      - "7077:7077"
      - "8081:8080"
      - "10001:10001"
    command: ["./entrypoint.sh"]
    restart: on-failure
  sedonadbt:
    image: sedonadbt
    build:
      context: "./cli/internal/adapter/client/imagebuilder/docker/sedonadbt"
    container_name: sedonadbt
    profiles:
      - "chapter-6-4"
    restart: on-failure
    volumes:
      - ./book/chapter6/geospatialdbt:/opt/workspace
  postgres:
    image: postgres:16
    profiles:
      - "chapter-8-4"
      - "chapter-11-1"
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: sedona
      POSTGRES_PASSWORD: sedona
      POSTGRES_DB: sedona
  mcp_server:
    build:
      context: "./geospatialagent"
    ports:
      - "9080:9080"
    profiles:
      - "chapter-11-1"
  n8n:
    image: docker.n8n.io/n8nio/n8n
    build:
      context: "./cli/internal/adapter/client/imagebuilder/docker/n8n"
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: "UTC"
      TZ: "UTC"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
    profiles:
      - "chapter-11-1"
    volumes:
#      - ./book/geospatialagent:/home/node/.n8n
      - ./geospatialagent/workflow.json:/home/node/workflow.json
  postgis:
    build:
      context: "./cli/internal/adapter/client/imagebuilder/docker/postgis"
    ports:
      - "5432:5432"
    profiles:
      - "chapter-3-3"
  mysql-sedona:
    build:
      context: "./cli/internal/adapter/client/imagebuilder/docker/mysql-sedona"
    ports:
      - "3306:3306"
    profiles:
      - "chapter-3-3"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sedona
  mongo-sedona:
    build:
      context: "./cli/internal/adapter/client/imagebuilder/docker/mongo-sedona"
    ports:
      - "27017:27017"
    profiles:
      - "chapter-3-3"
  kafka-sedona:
    build:
      context: "./cli/internal/adapter/client/imagebuilder/docker/kafka-sedona"
    container_name: kafka-sedona
    profiles:
      - "chapter-3-3"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://localhost:9093,PLAINTEXT://kafka-sedona:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-sedona:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
  debezium:
    build:
      context: "./cli/internal/adapter/client/imagebuilder/docker/debezium-sedona"
    container_name: debezium
    profiles:
      - "chapter-3-3"
    depends_on:
      - kafka-sedona
      - postgis
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka-sedona:29092
      GROUP_ID: 1
      ENABLE_DEBEZIUM_SCRIPTING: 'true'
      CONFIG_STORAGE_TOPIC: sedona_configs
      OFFSET_STORAGE_TOPIC: sedona_offsets
      STATUS_STORAGE_TOPIC: sedona_statuses

  kafka-ui:
    image: provectuslabs/kafka-ui
    environment:
      DYNAMIC_CONFIG_ENABLED: true
    ports:
      - "8089:8080"
    profiles:
      - "chapter-3-3"
    depends_on:
      - kafka-sedona