images:
  postgres:
    name: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sedona
      POSTGRES_PASSWORD: sedona
      POSTGRES_DB: sedona
  airflow:
    name: airflow:2.10.2
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: 'SequentialExecutor'
    mount-path: /opt/airflow
  debezium:
    name: debezium-sedona:3.2.1
    container-name: debezium-sedona
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka-sedona:29092
      GROUP_ID: 1
      ENABLE_DEBEZIUM_SCRIPTING: 'true'
      CONFIG_STORAGE_TOPIC: sedona_configs
      OFFSET_STORAGE_TOPIC: sedona_offsets
      STATUS_STORAGE_TOPIC: sedona_statuses
    health-check:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083/ || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
  kafka-ui:
    name: provectuslabs/kafka-ui
    environment:
      DYNAMIC_CONFIG_ENABLED: true
    ports:
      - "8089:8080"
  kafka:
    name: kafka-sedona:4.0.0
    container-name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://localhost:9093,PLAINTEXT://kafka-sedona:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-sedona:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    health-check:
        test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1" ]
        interval: 5s
        timeout: 5s
        retries: 5
  mongo:
    name: mongo-sedona:7.0.23
    container-name: mongo
    mount-path: /opt/workspace
    ports:
      - "27017:27017"
    health-check:
      test: [ "CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
  mysql:
    name: mysql-sedona:9.1.0
    container-name: mysql
    mount-path: /opt/workspace
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sedona
    health-check:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root --silent || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
  postgis:
    name: postgis:17-3.4
#    mount-path: /opt/workspace
    ports:
      - "5432:5432"
  thriftserver:
    name: thriftserver:1.0
    show-in-browser: false
    container-name: thriftserver
    ports:
      - "4040:4040"
      - "7077:7077"
      - "8080:8080"
      - "10001:10001"
  sedonadbt:
    name: sedonadbt:1.0
    show-in-browser: false
    container-name: sedonadbt
    mount-path: /opt/workspace
    ports:
      - "8888:8888"
  sedona:
    name: sedona:1.8.0
    container-name: sedona-jupyter
    mount-path: /opt/workspace
    show-in-browser: true
    ports:
      - "4040:4040"
      - "7077:7077"
      - "8081:8080"
      - "8888:8888"
    health-check:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
  sedonadb:
    name: sedonadb:1.7.2
    container-name: sedonadb-jupyter
    mount-path: /opt/workspace
    show-in-browser: true
    ports:
      - "8888:8888"
    health-check:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
  sedona-ai:
    name: sedona-ai:1.7.2
    container-name: sedona-ai
    mount-path: /home/ubuntu/sedona-ai
    show-in-browser: true
    browser-open-path: http://localhost:8888/lab/tree
    ports:
      - "4040:4040"
      - "7077:7077"
      - "8080:8080"
      - "8888:8888"
    health-check:
      test: [ "CMD-SHELL", "curl -f http://localhost:8888/ || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
  minio:
    name: minio:1.0.0
    container-name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: sedona
      MINIO_ROOT_PASSWORD: sedona_password
    mount-path: /app/sources
  ors:
    name: ors:v8.0.0
    ports:
      - "8085:8082"
    environment:
      REBUILD_GRAPHS: False
      ors.engine.source_file: /home/ors/files/ile-de-france-latest.osm.pbf
    health-check:
      test: [ "CMD-SHELL", "curl -f http://localhost:8082/ors/v2/health || exit 1" ]
      start_period: 1m
      interval: 10s
      timeout: 2s
      retries: 3
  prefect:
    name: prefecthq/3.4.23-python3.11
    container-name: prefect
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_URL: http://localhost:4200/api
    health-check:
      test: [ "CMD-SHELL", "curl -f http://localhost:4200/ || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
